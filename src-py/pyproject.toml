[project]
name = "dax-py"
version = "0.7.0"
description = "dax backend — Python port (yt-dlp + vendored Rust extractor)"
requires-python = ">=3.14"
dependencies = [
    "yt-dlp[default,curl-cffi]>=2026.8.19",
    "litestar>=2.13",
    "msgspec>=0.18",
    "uvicorn[standard]>=0.54.0",
    "structlog>=26.1.0",
    "orjson>=3.13.0",
    "cachebox>=6.2.8",
    "websockets>=17.2",
]

[tool.uv]
package = false
