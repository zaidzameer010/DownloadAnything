[project]
name = "downloadanything-py"
version = "0.7.5"
description = "DownloadAnything backend — Python port (yt-dlp + vendored Rust extractor)"
requires-python = ">=3.14"
dependencies = [
    "yt-dlp[default,curl-cffi]>=2026.8.19",
    "litestar>=2.13",
    "msgspec>=0.18",
    "uvicorn[standard]>=0.54.0",
    "structlog>=26.1.0",
    "orjson>=3.13.0",
    "cachebox>=6.2.8",
    "websockets>=17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "PIE", "RUF"]
ignore = [
    # En/em dashes and arrows are deliberate in comments and docstrings.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["downloadanything"]

[tool.ruff.lint.per-file-ignores]
# The contract suite is a single long-lived script with deliberate local
# imports and fixture lambdas; style is enforced on the package, not here.
"test_contract.py" = [
    "E401",
    "E501",
    "E741",
    "E731",
    "I001",
    "RUF005",
    "RUF012",
    "SIM105",
    "UP037",
]
