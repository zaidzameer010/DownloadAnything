[package]
name = "dax_rs"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "dax_rs"
# rlib: integration tests link the library; cdylib: the Python extension.
crate-type = ["cdylib", "rlib"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "gzip", "brotli", "zstd", "charset", "http2", "system-proxy", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
futures = "0.3"
url = { version = "2", features = ["serde"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
hex = "0.4"
aho-corasick = "1.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
urlencoding = "2"
bytes = "1"
pyo3 = { version = "0.29", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = "0.29"
