<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DownloadAnything · Extension Settings</title>
    <style>
      /* Mirrors the DownloadAnything desktop app theme (ui/src/index.css): minimal
         monochrome dark — near-black canvas, flat hairline surfaces,
         softened ink, desaturated status accents, Geist type. */
      :root {
        color-scheme: dark;
        --background: oklch(0.135 0 0);
        --surface: oklch(0.16 0 0);
        --surface-secondary: oklch(0.20 0 0);
        --surface-tertiary: oklch(0.24 0 0);
        --foreground: oklch(0.905 0 0);
        --foreground-secondary: oklch(0.70 0 0);
        --muted: oklch(0.58 0 0);
        --muted-subtle: oklch(0.44 0 0);
        --accent: oklch(0.90 0 0);
        --accent-foreground: oklch(0.09 0 0);
        --accent-hover: oklch(0.955 0 0);
        --default: oklch(0.19 0 0);
        --default-hover: oklch(0.225 0 0);
        --border: oklch(0.205 0 0);
        --border-secondary: oklch(0.25 0 0);
        --separator: oklch(0.175 0 0);
        --focus: oklch(0.80 0 0);
        --field-background: oklch(0.185 0 0);
        --field-hover: oklch(0.22 0 0);
        --field-focus: oklch(0.205 0 0);
        --field-placeholder: oklch(0.44 0 0);
        --field-border-focus: oklch(0.45 0 0);
        --success: oklch(0.71 0.115 155);
        --success-foreground: oklch(0.12 0.02 155);
        --success-soft: oklch(0.71 0.115 155 / 0.09);
        --success-soft-foreground: oklch(0.79 0.085 155);
        --danger: oklch(0.63 0.15 25);
        --danger-soft: oklch(0.63 0.15 25 / 0.09);
        --danger-soft-foreground: oklch(0.78 0.09 25);
        --radius: 0.625rem;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --dur-fast: 120ms;
        --font-sans: "Geist Variable", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", sans-serif;
        --font-mono: "Geist Mono Variable", ui-monospace, SFMono-Regular, Menlo,
          Monaco, Consolas, monospace;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: 13.5px;
        line-height: 1.5;
        letter-spacing: -0.008em;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      .card {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        padding: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }

      .app-icon {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: var(--accent);
        display: grid;
        place-items: center;
      }

      .app-icon svg {
        width: 13px;
        height: 13px;
        stroke: var(--accent-foreground);
        stroke-width: 2.5;
      }

      .version-tag {
        font-size: 11px;
        font-family: var(--font-mono);
        color: var(--muted-subtle);
        font-weight: 400;
      }

      /* StatusLine — soft semantic chip with dot */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-family: var(--font-mono);
        font-weight: 500;
        background: oklch(1 0 0 / 0.04);
        color: var(--muted);
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted-subtle);
      }

      .status-badge.connected {
        background: var(--success-soft);
        color: var(--success-soft-foreground);
      }
      .status-badge.connected .status-dot { background: var(--success); }

      .status-badge.error {
        background: var(--danger-soft);
        color: var(--danger-soft-foreground);
      }
      .status-badge.error .status-dot { background: var(--danger); }

      .field-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--foreground-secondary);
        letter-spacing: -0.005em;
      }

      .field-desc {
        font-size: 12px;
        color: var(--muted);
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      input[type="text"],
      input[type="password"],
      input[type="number"] {
        width: 100%;
        height: 36px;
        padding: 0 12px;
        background: var(--field-background);
        border: 1px solid transparent;
        border-radius: var(--radius);
        color: var(--foreground);
        font-family: var(--font-mono);
        font-size: 12px;
        outline: none;
        transition:
          background-color var(--dur-fast) var(--ease-out),
          box-shadow var(--dur-fast) var(--ease-out);
      }

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] { appearance: textfield; -moz-appearance: textfield; }

      input::placeholder { color: var(--field-placeholder); }

      input:hover:not(:focus) { background: var(--field-hover); }

      input:focus {
        background: var(--field-focus);
        box-shadow: 0 0 0 1.5px var(--field-border-focus);
      }

      .input-actions {
        position: absolute;
        right: 6px;
        display: flex;
        gap: 4px;
      }

      .btn-tactile {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--default);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        transition:
          background-color var(--dur-fast) var(--ease-out),
          border-color var(--dur-fast) var(--ease-out),
          color var(--dur-fast) var(--ease-out);
      }

      .btn-tactile:hover {
        background: var(--default-hover);
        border-color: var(--border-secondary);
        color: var(--foreground);
      }

      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 14px;
        border-top: 1px solid var(--separator);
      }

      #status-line {
        flex: 1;
        font-size: 11px;
        font-family: var(--font-mono);
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .btn-primary {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        padding: 7px 14px;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--accent-foreground);
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: -0.006em;
        transition:
          background-color var(--dur-fast) var(--ease-out),
          box-shadow var(--dur-fast) var(--ease-out);
      }

      .btn-primary:hover { background: var(--accent-hover); }

      .btn-primary:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--focus);
      }

      .btn-primary.saved {
        background: var(--success);
        color: var(--success-foreground);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head">
        <div class="brand">
          <div class="app-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v13"/><path d="m6.5 10.5 5.5 5.5 5.5-5.5"/><path d="M4 21h16"/>
            </svg>
          </div>
          DownloadAnything <span class="version-tag" id="version-tag"></span>
        </div>
        <div id="status-badge" class="status-badge">
          <span class="status-dot"></span>
          <span id="status-label">No Token</span>
        </div>
      </div>

      <div class="field-row">
        <label class="field-label" for="token">Extension API Token</label>
        <div class="input-wrapper">
          <input id="token" type="password" placeholder="Paste extension token from DownloadAnything" />
          <div class="input-actions">
            <button id="btn-toggle-token" class="btn-tactile">Show</button>
            <button id="btn-paste-token" class="btn-tactile">Paste</button>
          </div>
        </div>
        <span class="field-desc">DownloadAnything app → Options → Engine → Extension token.</span>
      </div>

      <div class="field-row">
        <label class="field-label" for="port">Desktop API Port</label>
        <input id="port" type="number" min="1" max="65535" placeholder="16801" />
      </div>

      <div class="foot">
        <span id="status-line"></span>
        <button id="btn-save" class="btn-primary">Save</button>
      </div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
