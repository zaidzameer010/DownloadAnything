name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for release (e.g., v1.0.0)'
        required: true

jobs:
  release:
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Forces the workflow to fetch the absolute latest commit that triggered the run
          ref: ${{ github.sha }}

      - name: Download aria2-next binary (macOS)
        if: matrix.platform == 'macos-latest'
        run: gh release download -R AnInsomniacy/aria2-next --pattern "aria2-next-*-macos-arm64" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download aria2-next binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          gh release download -R AnInsomniacy/aria2-next --pattern "aria2-next-*-windows-x86_64.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Rust cache
        id: rust-cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-all-crates: true
          prefix-key: "rust-cache-${{ matrix.platform }}"

      - name: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # Uses the manual input if dispatched manually; falls back to the git tag on push
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'DownloadAnything ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: 'DownloadAnything Release'
          releaseDraft: true
          prerelease: false
          # Let the custom updater-json job generate and upload the combined latest.json.
          includeUpdaterJson: false
          args: --config '{"plugins":{"updater":{"pubkey":"${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}"}}}'

      - name: Cleanup old caches for OS
        shell: bash # Forces Bash on Windows so '|| true' doesn't cause a syntax error
        run: |
          PLATFORM="${{ matrix.platform }}"
          echo "Checking for previous caches to clean up for platform: $PLATFORM"
          CACHES_JSON=$(gh cache list --limit 100 --json id,key 2>/dev/null || echo "[]")
          CACHE_IDS=$(echo "$CACHES_JSON" | jq -r --arg plat "$PLATFORM" '.[] | select(.key | contains($plat)) | .id')
          if [ -n "$CACHE_IDS" ]; then
            for id in $CACHE_IDS; do
              echo "Deleting previous cache ID $id for platform $PLATFORM..."
              gh cache delete "$id" || true
            done
          else
            echo "No previous caches found for platform $PLATFORM."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  updater-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release assets
        run: |
          TAG=${{ github.event.inputs.version || github.ref_name }}
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          gh release download "$TAG" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate combined latest.json
        run: |
          python3 -c '
          import os, json, glob, datetime
          tag = os.getenv("RELEASE_TAG")
          owner_repo = os.getenv("GITHUB_REPOSITORY")
          latest = {
              "version": tag.lstrip("v"),
              "notes": f"Release {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {}
          }
          for sig_file in glob.glob("*.sig"):
              archive_file = sig_file[:-4]
              if not os.path.exists(archive_file):
                  continue
              with open(sig_file, "r") as f:
                  sig = f.read().strip()
              lower = archive_file.lower()
              key = None
              if lower.endswith(".app.tar.gz") and ("aarch64" in lower or "arm64" in lower):
                  key = "darwin-aarch64"
              elif (lower.endswith(".exe") or lower.endswith(".msi")) and ("x86_64" in lower or "x64" in lower):
                  key = "windows-x86_64"
              if key:
                  latest["platforms"][key] = {
                      "signature": sig,
                      "url": f"https://github.com/{owner_repo}/releases/download/{tag}/{archive_file}"
                  }
          with open("latest.json", "w") as f:
              json.dump(latest, f, indent=2)
          print("Generated latest.json:")
          print(json.dumps(latest, indent=2))
          '
        env:
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

      - name: Upload latest.json back to release
        run: |
          TAG=${{ github.event.inputs.version || github.ref_name }}
          gh release upload "$TAG" latest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}