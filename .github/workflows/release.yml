name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for release (e.g., v1.0.0)'
        required: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serial: both legs merge into the same latest.json — parallel uploads race.
      max-parallel: 1
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    env:
      ARIA2_VERSION: 3.0.9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Forces the workflow to fetch the absolute latest commit that triggered the run
          ref: ${{ github.sha }}

      - name: Download aria2-next binary (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "v${ARIA2_VERSION}" -R AnInsomniacy/aria2-next --pattern "aria2-next-${ARIA2_VERSION}-macos-arm64" --clobber

      - name: Download aria2-next binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "v${ARIA2_VERSION}" -R AnInsomniacy/aria2-next --pattern "aria2-next-${ARIA2_VERSION}-windows-x86_64.exe" --clobber

      # beforeBuildCommand runs `bun run backend:bundle`: uv sync, downloadanything_rs
      # built against the venv Python, then the venv + uv CPython + downloadanything
      # package staged into src-tauri/resources for the bundle.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install UI dependencies
        run: bun install --cwd ui

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Stable shared key: tag runs restore caches saved on the default branch
      # (e.g. by workflow_dispatch); GitHub cache scoping makes tag-saved
      # caches invisible to other tags, so no manual cache rotation is done.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          save-if: true
          prefix-key: "rust-cache-${{ matrix.platform }}"
          shared-key: "release"

      # tauri.conf.json version is what the updater compares against — it must
      # equal the release tag or every launch reports a newer release forever.
      - name: Sync app version to tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          jq --arg v "${TAG#v}" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # Uses the manual input if dispatched manually; falls back to the git tag on push
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'DownloadAnything ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: 'DownloadAnything Release'
          releaseDraft: true
          prerelease: false
          # Root package.json has no CLI dep; the script runs the UI's tauri.js
          tauriScript: 'bun run tauri'
          # NSIS -setup.exe is the conventional updater artifact over MSI
          updaterJsonPreferNsis: true
          args: --config '{"plugins":{"updater":{"pubkey":"${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}"}}}'
